{% include base_path %}
<header class="jarvis-header">
  <a class="wordmark" href="{{ base_path }}/" aria-label="Sangbum Daniel Choi, home">
    <span class="wordmark__text">Sangbum Daniel Choi</span>
  </a>
  <nav class="jarvis-nav" aria-label="Primary navigation">
    <a href="{{ base_path }}/cv/"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
    <a href="{{ base_path }}/publications/"{% if page.url == '/publications/' or page.collection == 'publications' %} aria-current="page"{% endif %}>Research</a>
    <a href="{{ base_path }}/year-archive/"{% if page.url == '/year-archive/' or page.collection == 'posts' %} aria-current="page"{% endif %}>Writing</a>
    <a href="{{ base_path }}/github/"{% if page.url == '/github/' %} aria-current="page"{% endif %}>Open source</a>
    {% if include.interactive %}<button class="icon-button" id="clear-chat" type="button" title="New conversation" aria-label="Clear conversation"><i data-lucide="square-pen" aria-hidden="true"></i></button>{% else %}<a class="nav-chat-link" href="{{ base_path }}/">Ask Daniel</a>{% endif %}
  </nav>
</header>
